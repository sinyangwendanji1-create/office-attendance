<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZRDC Attendance System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="authView" class="view-container">
        <div class="card">
            <h2>ZRDC Portal Login</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="emailInput">Email:</label>
                    <input type="email" id="emailInput" required>
                </div>
                <div class="form-group">
                    <label for="passwordInput">Password:</label>
                    <input type="password" id="passwordInput" required>
                </div>
                <button type="submit" class="primary-btn">Login</button>
            </form>
            <p id="authMessage" class="error-msg"></p>
        </div>
    </div>

    <div id="appView" class="view-container hidden">
        <nav class="navbar">
            <h2>ZRDC Attendance System</h2>
            <div class="menu-tabs">
                <button class="tab-btn active" data-target="attendanceTab">Attendance Portal</button>
                <button class="tab-btn" data-target="reportsTab">Reports & Export</button>
                <button id="logoutBtn" class="danger-btn">Logout</button>
            </div>
        </nav>

        <div class="main-content">
            <div id="attendanceTab" class="tab-content">
                <div class="card">
                    <h3>Check-In / Check-Out</h3>
                    <div class="form-group">
                        <label>Full Name:</label>
                        <input type="text" id="nameInput" required>
                    </div>
                    <div class="form-group">
                        <label>SIN Number:</label>
                        <input type="text" id="sinInput" required>
                    </div>
                    <div class="form-group">
                        <label>Task Done Summary:</label>
                        <textarea id="taskSummaryInput" rows="3" placeholder="Summarize your tasks..."></textarea>
                    </div>
                    <div class="form-group">
                        <label>Digital Signature:</label>
                        <canvas id="signatureCanvas" width="400" height="150" style="border: 1px solid #ccc;"></canvas>
                        <br>
                        <button type="button" id="clearSigBtn">Clear Signature</button>
                    </div>
                    <div class="button-row">
                        <button id="checkInBtn" class="primary-btn">Check In</button>
                        <button id="checkOutBtn" class="primary-btn">Check Out</button>
                    </div>
                </div>

                <div class="card">
                    <h3>Activity Log</h3>
                    <table class="log-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Status</th>
                                <th>In Time</th>
                                <th>Out Time</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody"></tbody>
                    </table>
                </div>
            </div>

            <div id="reportsTab" class="tab-content hidden">
                <div class="card">
                    <h3>Reports & Document Export</h3>
                    <p>Print or download your attendance records in various formats.</p>
                    <div class="button-row">
                        <button id="printBtn" class="secondary-btn">Print Report</button>
                        <button id="exportPdfBtn" class="secondary-btn">Download PDF</button>
                        <button id="exportWordBtn" class="secondary-btn">Download Word (.docx)</button>
                        <button id="exportExcelBtn" class="secondary-btn">Download Excel (.xlsx)</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.1.7/dist/signature_pad.umd.min.js"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
