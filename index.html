<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Attendance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 650px;
    }
    h2 {
      color: #333333;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444444;
      font-size: 14px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #007bff;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
    }
    .btn-register { background-color: #007bff; color: #ffffff; }
    .btn-checkin { background-color: #28a745; color: #ffffff; }
    .btn-checkout { background-color: #dc3545; color: #ffffff; }
    .btn-print { width: 100%; background-color: #17a2b8; color: #ffffff; margin-top: 10px; }
    h3 {
      margin-top: 25px;
      margin-bottom: 10px;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 8px;
      text-align: left;
      font-size: 12px;
    }
    th {
      background-color: #f8f9fa;
    }
    @media print {
      body { background: #ffffff; display: block; }
      .card { box-shadow: none; max-width: 100%; padding: 0; }
      button, input, textarea, label, .form-group { display: none !important; }
      h2, h3 { display: block !important; }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Office Attendance</h2>
    
    <div class="form-group">
      <label for="studentName">Student Name</label>
      <input type="text" id="studentName" placeholder="Enter Full Name">
    </div>

    <div class="form-group">
      <label for="studentNumber">Student Number (SIN)</label>
      <input type="text" id="studentNumber" placeholder="Enter SIN">
    </div>

    <div class="form-group">
      <label for="taskInput">Task Completed Today</label>
      <textarea id="taskInput" placeholder="Describe today's tasks..." rows="2"></textarea>
    </div>

    <div class="btn-group">
      <button class="btn-register" onclick="handleAction('register')">Register</button>
      <button class="btn-checkin" onclick="handleAction('check-in')">Check In</button>
      <button class="btn-checkout" onclick="handleAction('check-out')">Check Out</button>
    </div>
    
    <button class="btn-print" onclick="window.print()">🖨️ Print Attendance Report</button>

    <h3>Activity Log</h3>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Action</th>
          <th>Time</th>
          <th>Task</th>
          <th>Location</th>
          <th>IP</th>
        </tr>
      </thead>
      <tbody id="logTableBody">
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
