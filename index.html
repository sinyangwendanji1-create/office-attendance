<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Attendance System</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 8px;
      box-sizing: border-box;
    }
    button {
      padding: 10px 15px;
      margin-right: 10px;
      margin-top: 10px;
      cursor: pointer;
    }
    .btn-print {
      background-color: #28a745;
      color: white;
      border: none;
    }
    @media print {
      button, input, textarea, label {
        display: none !important;
      }
      body {
        margin: 0;
        padding: 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000;
        padding: 8px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <h2>Office Attendance System</h2>
  
  <div class="form-group">
    <label for="studentIdInput">Student / Employee ID:</label>
    <input type="text" id="studentIdInput" placeholder="Enter ID" required>
  </div>

  <div class="form-group">
    <label for="taskInput">Task Completed Today:</label>
    <textarea id="taskInput" placeholder="Describe the tasks completed..." rows="3" required></textarea>
  </div>

  <button onclick="handleAttendance('check-in')">Check In</button>
  <button onclick="handleAttendance('check-out')">Check Out</button>
  <button class="btn-print" onclick="window.print()">🖨️ Print Attendance Report</button>

  <script src="script.js"></script>
</body>
</html>
