<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Office Attendance System</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #f4f7f6;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 480px;
    }
    h2 {
      color: #333333;
      margin-bottom: 20px;
      text-align: center;
    }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: #444444;
      font-size: 14px;
    }
    input[type="text"], textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cccccc;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: #007bff;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn-checkin {
      background-color: #007bff;
      color: #ffffff;
    }
    .btn-checkin:hover {
      background-color: #0056b3;
    }
    .btn-checkout {
      background-color: #6c757d;
      color: #ffffff;
    }
    .btn-checkout:hover {
      background-color: #545b62;
    }
    .btn-print {
      width: 100%;
      background-color: #28a745;
      color: #ffffff;
      margin-top: 10px;
    }
    .btn-print:hover {
      background-color: #218838;
    }
    @media print {
      body {
        background: #ffffff;
        display: block;
      }
      .card {
        box-shadow: none;
        max-width: 100%;
        padding: 0;
      }
      button, input, textarea, label {
        display: none !important;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th, td {
        border: 1px solid #000000;
        padding: 8px;
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Office Attendance System</h2>
    
    <div class="form-group">
      <label for="studentIdInput">Student ID:</label>
      <input type="text" id="studentIdInput" placeholder="Enter ID" required>
    </div>

    <div class="form-group">
      <label for="taskInput">Task Completed Today:</label>
      <textarea id="taskInput" placeholder="Describe the tasks completed..." rows="3" required></textarea>
    </div>

    <div class="btn-group">
      <button class="btn-checkin" onclick="handleAttendance('check-in')">Check In</button>
      <button class="btn-checkout" onclick="handleAttendance('check-out')">Check Out</button>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ Print Attendance Report</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
